apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintech-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/laksh1001/fintech-gitops-playbook.git'
    targetRevision: main
    path: helm/fintech-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: fintech
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

