{{- range $serviceName, $serviceConfig := .Values }}
{{- if and (kindIs "map" $serviceConfig) $serviceConfig.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName | kebabcase }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $serviceName | kebabcase }}
    env: {{ $.Values.global.environment }}
spec:
  replicas: {{ $serviceConfig.replicaCount }}
  selector:
    matchLabels:
      app: {{ $serviceName | kebabcase }}
  template:
    metadata:
      labels:
        app: {{ $serviceName | kebabcase }}
    spec:
      containers:
      - name: {{ $serviceName | kebabcase }}
        image: "{{ $serviceConfig.image.repository }}:{{ $serviceConfig.image.tag }}"
        imagePullPolicy: {{ $serviceConfig.image.pullPolicy }}
        ports:
        - containerPort: {{ $serviceConfig.service.port }}
        resources:
          limits:
            cpu: {{ $serviceConfig.resources.limits.cpu }}
            memory: {{ $serviceConfig.resources.limits.memory }}
          requests:
            cpu: {{ $serviceConfig.resources.requests.cpu }}
            memory: {{ $serviceConfig.resources.requests.memory }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ $serviceConfig.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ $serviceConfig.service.port }}
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName | kebabcase }}
  namespace: {{ $.Values.global.namespace }}
spec:
  type: {{ $serviceConfig.service.type }}
  selector:
    app: {{ $serviceName | kebabcase }}
  ports:
  - port: {{ $serviceConfig.service.port }}
    targetPort: {{ $serviceConfig.service.port }}
{{- end }}
{{- end }}
